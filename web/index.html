<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fontmerge</title>
  <meta name="description" content="Merge a Western font and a Chinese/Japanese font into one font file, in your browser.">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div>
      <h1 data-i18n="title">fontmerge</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <button id="lang" class="lang" type="button" data-i18n="language">中文</button>
  </header>

  <main>
    <p class="privacy" data-i18n="privacy"></p>

    <form id="form" novalidate>
      <section class="fonts">
        <div class="font-slot" data-role="western">
          <label class="drop" id="western-drop">
            <span class="drop-title" data-i18n="westernFont"></span>
            <span class="drop-help" data-i18n="westernHelp"></span>
            <input id="western" class="visually-hidden" type="file" accept=".ttf,.otf,.ttc,.otc,.woff,.woff2">
            <span class="file-name" id="western-name" data-i18n="dropHere"></span>
          </label>
          <label class="face" id="western-face-row" hidden><span data-i18n="face"></span>
            <select id="western-face"></select>
          </label>
          <div class="summary" id="western-summary" aria-live="polite"></div>
        </div>

        <button id="swap" class="swap" type="button" title="" data-i18n-title="swap" disabled>⇄</button>

        <div class="font-slot" data-role="cjk">
          <label class="drop" id="cjk-drop">
            <span class="drop-title" data-i18n="cjkFont"></span>
            <span class="drop-help" data-i18n="cjkHelp"></span>
            <input id="cjk" class="visually-hidden" type="file" accept=".ttf,.otf,.ttc,.otc,.woff,.woff2">
            <span class="file-name" id="cjk-name" data-i18n="dropHere"></span>
          </label>
          <label class="face" id="cjk-face-row" hidden><span data-i18n="face"></span>
            <select id="cjk-face"></select>
          </label>
          <div class="summary" id="cjk-summary" aria-live="polite"></div>
        </div>
      </section>

      <section class="settings">
        <label><span data-i18n="family"></span>
          <input id="family" type="text" value="Merged" maxlength="63" autocomplete="off">
        </label>
        <label><span data-i18n="style"></span>
          <input id="style" type="text" value="Regular" maxlength="63" autocomplete="off">
        </label>
        <label><span data-i18n="scale"></span>
          <input id="scale" type="number" min="0.5" max="2" step="0.01" data-i18n-placeholder="scaleHelp">
        </label>
        <label><span data-i18n="lineHeight"></span>
          <select id="line-height">
            <option value="cjk" data-i18n="lineCjk"></option>
            <option value="western" data-i18n="lineWestern"></option>
            <option value="max" data-i18n="lineMax"></option>
          </select>
        </label>
        <label><span data-i18n="format"></span>
          <select id="format">
            <option value="ttf" selected>TTF</option>
            <option value="otf">OTF</option>
          </select>
        </label>
        <p id="suggested" class="suggested" data-i18n="suggested" hidden></p>
      </section>
      <p id="rfn-warning" class="warning" hidden></p>

      <details class="more">
        <summary data-i18n="more"></summary>
        <div class="settings">
          <label><span data-i18n="punctuation"></span>
            <select id="punctuation">
              <option value="split" data-i18n="punctSplit"></option>
              <option value="western" data-i18n="punctWestern"></option>
              <option value="cjk" data-i18n="punctCjk"></option>
            </select>
          </label>
          <label><span data-i18n="symbols"></span>
            <select id="symbols">
              <option value="cjk" data-i18n="fromCjkFont"></option>
              <option value="western" data-i18n="fromWesternFont"></option>
            </select>
          </label>
          <label><span data-i18n="outline"></span>
            <select id="outline">
              <option value="auto" data-i18n="outlineAuto"></option>
              <option value="glyf">TrueType (glyf)</option>
              <option value="CFF">CFF</option>
            </select>
          </label>
          <label><span data-i18n="baselineShift"></span>
            <input id="baseline-shift" type="number" step="1" placeholder="0">
          </label>
          <label><span data-i18n="fontVersion"></span>
            <input id="font-version" type="text" value="1.000" pattern="\d+\.\d{3}">
          </label>
          <label><span data-i18n="vendor"></span>
            <input id="vendor" type="text" value="NONE" maxlength="4">
          </label>
          <label class="check"><input id="include-hangul" type="checkbox"> <span data-i18n="includeHangul"></span></label>
          <label class="check"><input id="fallback" type="checkbox" checked> <span data-i18n="fallback"></span></label>
          <label class="check"><input id="strict" type="checkbox"> <span data-i18n="strict"></span></label>
          <label class="wide"><span data-i18n="overrides"></span>
            <textarea id="overrides" rows="3" spellcheck="false" data-i18n-placeholder="overridesHelp"></textarea>
          </label>
        </div>
      </details>

      <div class="actions">
        <button id="merge" class="primary" type="submit" data-i18n="merge"></button>
        <button id="cancel" type="button" data-i18n="cancel" hidden></button>
        <p id="status" class="status" data-state="loading" role="status" aria-live="polite"></p>
      </div>
      <progress id="bar" max="11" value="0" hidden></progress>
    </form>

    <section id="progress-panel" class="panel" hidden>
      <h2><span data-i18n="progress"></span> <span id="elapsed" class="elapsed"></span></h2>
      <ol id="progress" class="progress"></ol>
    </section>

    <section id="error-panel" class="panel error" hidden>
      <p id="error-message"></p>
      <p id="error-hint" class="hint" hidden><strong data-i18n="hint"></strong>: <span></span></p>
      <pre id="error-detail" hidden></pre>
    </section>

    <section id="result-panel" class="panel" hidden>
      <h2 data-i18n="result"></h2>
      <dl class="stats">
        <div><dt data-i18n="glyphs"></dt><dd id="r-glyphs"></dd></div>
        <div><dt data-i18n="characters"></dt><dd id="r-chars"></dd></div>
        <div><dt data-i18n="time"></dt><dd id="r-time"></dd></div>
        <div><dt data-i18n="memory"></dt><dd id="r-memory"></dd></div>
      </dl>
      <p><a id="download" class="primary button" data-i18n="download" href="#"></a> <span id="r-file"></span></p>
      <h3 data-i18n="issues"></h3>
      <ul id="issues" class="issues"></ul>
    </section>

    <p class="note" data-i18n="licenceNote"></p>
  </main>

  <footer id="footer"></footer>
</body>
</html>
