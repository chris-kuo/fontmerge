name: Live site check

# Weekly, and on demand: open the public site in Chromium, Firefox and WebKit (Safari's
# engine) and run the smoke tests, so a broken CDN, Pyodide or browser update is noticed
# even when nobody pushes. A failed scheduled run notifies the repository owner.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test in ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[woff2]" pytest playwright
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Smoke tests against the live site
        env:
          FONTMERGE_BROWSER: "1"
          FONTMERGE_ENGINE: ${{ matrix.engine }}
          FONTMERGE_SITE_URL: https://chris-kuo.github.io/fontmerge/
        run: |
          set -o pipefail
          status=0
          pytest tests/browser -m smoke -v -rA --tb=short -p no:cacheprovider -o addopts="" 2>&1 \
            | tee live.log || status=$?
          python scripts/annotate.py pytest live.log
          exit $status
